<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Showcase Card</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 32px 16px; min-height: 100vh;
  font-family: Arial, sans-serif; background: #f3f5f9; color: #202638;
  display: flex; justify-content: center; align-items: center;
}
.product-card {
  width: 100%; max-width: 760px; background: white; border-radius: 20px;
  overflow: hidden; box-shadow: 0 12px 35px rgba(26,39,68,.12);
  display: grid; grid-template-columns: 1fr;
}
.product-visual {
  min-height: 250px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg,#dce8f8,#a8bedc);
}
.product-visual:hover .mat { transform: scale(1.04); }
.badge {
  position: absolute; top: 18px; left: 18px; z-index: 2;
  background: #263c68; color: white; padding: 8px 13px;
  border-radius: 20px; font-size: 11px; font-weight: bold; letter-spacing: 1px;
}
.mat {
  width: 72%; height: 145px; border-radius: 18px;
  background: linear-gradient(145deg,#354a70,#172640);
  box-shadow: 0 18px 25px rgba(25,39,65,.3);
  transform: rotate(-7deg); transition: transform .3s ease;
  display: flex; align-items: center; justify-content: center;
}
.mat span { color: #dce6f5; font-size: 20px; letter-spacing: 4px; font-weight: bold; }
.product-info { padding: 28px; display: flex; flex-direction: column; gap: 13px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.category { color: #63718a; font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; font-weight: bold; }
.rating { color: #d18a18; font-size: 13px; font-weight: bold; white-space: nowrap; }
h1 { margin: 0; font-size: 27px; color: #202c43; }
.description { margin: 0; color: #68758b; line-height: 1.6; font-size: 14px; }
.features { display: flex; flex-wrap: wrap; gap: 8px; }
.features span { background: #eef2f8; color: #42536f; padding: 8px 11px; border-radius: 20px; font-size: 12px; }
.bottom { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-top: 8px; }
.price { font-size: 25px; font-weight: bold; color: #1e2e4b; }
button { border: 0; border-radius: 10px; background: #294779; color: white; padding: 13px 20px; font-weight: bold; cursor: pointer; transition: transform .2s, background .2s; }
button:hover { background: #1c345c; }
button:active { transform: scale(.96); }
@media (min-width: 768px) {
  .product-card { grid-template-columns: 1fr 1fr; }
  .product-visual { min-height: 420px; }
  .product-info { justify-content: center; padding: 38px; }
}
</style>
</head>
<body>
<main class="product-card">
  <section class="product-visual">
    <span class="badge">POPULAR</span>
    <div class="mat"><span>WORKSPACE</span></div>
  </section>
  <section class="product-info">
    <div class="topline"><span class="category">Desk Accessories</span><span class="rating">★ 4.9 (128 reviews)</span></div>
    <h1>Desk Workspace Mat</h1>
    <p class="description">Give your desk a clean and comfortable look with this stylish workspace mat. It is suitable for everyday study and office use.</p>
    <div class="features"><span>Water Resistant</span><span>Anti-Slip</span><span>Easy Clean</span></div>
    <div class="bottom"><span class="price">₹1,499</span><button type="button">Add to Bag</button></div>
  </section>
</main>
</body>
</html>
